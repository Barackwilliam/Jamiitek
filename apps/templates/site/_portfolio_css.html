{% load static %}<link rel="stylesheet" href="{% static 'css/jt-art.css' %}">
<style>
/* Portfolio — kadi za kazi (zinafanana na za About) na ukurasa wa kazi moja */
.works{display:grid;gap:22px}
@media (min-width:700px){.works{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1050px){.works{grid-template-columns:repeat(3,1fr)}}
.work{display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.work:hover{transform:translateY(-6px)}
.work__shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:#fff}
.work__shot img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:top;background:#fff;transition:transform 1.2s var(--ease)}
.work:hover .work__shot img{transform:scale(1.04)}
.work__body{display:flex;flex-direction:column;gap:8px;flex:1;padding:18px 20px 20px}
.work__cat{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#B4690A}
.work__body h3{font-size:20px;letter-spacing:-.03em}
.work__body p{color:var(--muted);font-size:14.5px}
.work__foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.work__foot b{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.work__foot svg{width:14px;height:14px}
.pf-empty{padding:40px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line);text-align:center;color:var(--muted)}

/* Ukurasa wa kazi moja */
.cs-shot{margin-top:6px}
.cs-shot .work__shot{aspect-ratio:16/10}
.cs-grid{display:grid;gap:34px}
@media (min-width:960px){.cs-grid{grid-template-columns:1.6fr 1fr;gap:56px;align-items:start}}
.cs-story h2{font-size:clamp(1.6rem,1rem + 1.8vw,2.3rem);margin-bottom:18px}
.cs-story p{font-size:17px;line-height:1.75;color:var(--ink-2);margin-bottom:18px}
.cs-facts{position:sticky;top:100px;padding:26px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh-1)}
.cs-facts dl{display:grid;gap:16px;margin:0}
.cs-facts dt{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cs-facts dd{margin:0;font-weight:600}
.cs-facts a{color:var(--navy-3);text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:6px 12px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600}
.cs-facts .btn{width:100%;margin-top:22px}
</style>
