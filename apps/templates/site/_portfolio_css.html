{% load static %}<link rel="stylesheet" href="{% static 'css/jt-art.css' %}">
<style>
/* Portfolio — orodha ya websites zote */
.works{display:grid;gap:22px}
@media (min-width:700px){.works{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1050px){.works{grid-template-columns:repeat(3,1fr)}}
.work{display:flex;flex-direction:column;scroll-margin-top:110px;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.work:hover{transform:translateY(-6px)}
.work:target{box-shadow:0 0 0 3px var(--gold),var(--sh-2)}
.work__shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:#fff}
.work__shot img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:top;background:#fff;transition:transform 1.2s var(--ease)}
.work:hover .work__shot img{transform:scale(1.04)}
.work__body{display:flex;flex-direction:column;gap:8px;flex:1;padding:18px 20px 20px}
.work__cat{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#B4690A}
.work__body h3{font-size:20px;letter-spacing:-.03em}
.work__body p{color:var(--muted);font-size:14.5px}
.work__foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.work__foot{gap:12px}
.work__foot .btn{flex:none;min-height:38px;padding:0 16px;font-size:13px}
.work__foot .btn svg{width:13px;height:13px}
.pf-empty{padding:40px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line);text-align:center;color:var(--muted)}
</style>
