{% load static jt_contact %}{% with u=request.resolver_match.url_name p=request.path %}
<header class="hdr" id="hdr"{% if hdr_pin %} data-pin{% endif %}>
  <i class="hdr__bar" aria-hidden="true"></i>
  <div class="wrap hdr__in">
    <a class="brand" href="{% url 'home' %}" aria-label="JamiiTek home">
      <picture><source srcset="{% static 'images/logo-96.webp' %}" type="image/webp"><img src="{% static 'images/logo-96.png' %}" alt="" width="46" height="40" fetchpriority="high"></picture>
      <span>Jamii<em>Tek</em></span>
    </a>
    <nav class="nav" aria-label="Main">
      <i class="nav__pill" aria-hidden="true"></i>
      <a href="{% url 'home' %}"{% if u == 'home' %} class="is-on" aria-current="page"{% endif %}>Home</a>
      <a href="{% url 'service' %}"{% if u == 'service' %} class="is-on" aria-current="page"{% endif %}>Services</a>
      <a href="{% url 'jamiibot_landing' %}"{% if u == 'jamiibot_landing' %} class="is-on" aria-current="page"{% endif %}>JamiiBot</a>
      <a href="{% url 'templates_marketplace' %}"{% if p|slice:':11' == '/templates/' %} class="is-on" aria-current="page"{% endif %}>Templates</a>
      <a href="{% url 'blog_list' %}"{% if p|slice:':6' == '/blog/' %} class="is-on" aria-current="page"{% endif %}>Blog</a>
      <a href="{% url 'About' %}"{% if u == 'About' %} class="is-on" aria-current="page"{% endif %}>About</a>
      <a href="{% url 'contact' %}"{% if u == 'contact' %} class="is-on" aria-current="page"{% endif %}>Contact</a>
    </nav>
    <div class="hdr__side">
      <a class="hdr__portal" href="{% url 'portal_login' %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Client Portal</a>
      <a class="btn btn--gold btn--sm hdr__cta" href="{% url 'get_started' %}">Start a project</a>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="side"><i></i></button>
    </div>
  </div>
</header>


{% include 'site/_side.html' %}
{% endwith %}
